services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./backend/data:/app/data"]
    environment:
      DATABASE_URL: sqlite:///./data/app.db
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
  # Optional PostgreSQL for cloud mode (uncomment + set DATABASE_URL):
  # db:
  #   image: postgres:16
  #   environment: [POSTGRES_DB=aisystem, POSTGRES_USER=aisystem, POSTGRES_PASSWORD=change-me]
