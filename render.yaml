# Render blueprint (Phase 9). Frontend goes on Vercel (see
# docs/DEPLOYMENT.md); this file covers backend + worker + Postgres.
services:
  - type: web
    name: aisystem-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: aisystem-db
          property: connectionString
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_MEDIA_BASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
  - type: worker
    name: aisystem-worker
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend python -m app.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aisystem-db
          property: connectionString
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_MEDIA_BASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production

databases:
  - name: aisystem-db
    databaseName: aisystem
    user: aisystem
